[project]
name = "noobfriend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zchao", email = "zchao@icrr.u-tokyo.ac.jp" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "astropy>=7.2.0",
    "gwcs>=1.0.3",
    "noobase>=0.0.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "stdatamodels>=5.0.2",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
# Test methods/functions are self-describing via their names; module- and
# class-level docstrings are still required.
"tests/**" = ["D102", "D103"]

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]
