[project]
name = "noobfriend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zchao", email = "zchao@icrr.u-tokyo.ac.jp" }
]
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiohttp>=3.13.5",
    "astropy>=7.2.0",
    "astroquery>=0.4.11",
    "bokeh>=3.9.0",
    "gwcs>=1.0.3",
    "jupyter-bokeh>=4.0.5",
    "matplotlib>=3.10.9",
    "noobase>=0.0.8",
    "numpy>=2.4.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "scikit-image>=0.26.0",
    "scipy>=1.17.1",
    "stdatamodels>=5.0.2",
    "typer>=0.26.6",
]

[project.scripts]
noobfriend = "noobfriend.cli.app:main"

[project.optional-dependencies]
mcmc = [
    "arviz>=1.3",
    "h5netcdf>=1.8.1",
    "h5py>=3.16.0",
    "jax>=0.12",
    "numpyro>=0.22",
]
cuda = [
    "jax[cuda12]; sys_platform == 'linux'",
]
psf = [
    "stpsf>=2.1.0",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]
# Test methods/functions are self-describing via their names; module- and
# class-level docstrings are still required.
"tests/**" = ["D102", "D103"]

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "ipykernel>=7.2.0",
    "nbconvert>=7.17.1",
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: sampling or otherwise long-running tests (deselect with -m 'not slow')",
    "integration: crosses subpackage boundaries or exercises an end-to-end flow",
]

[tool.importlinter]
root_package = "noobfriend"
# Lower layers may name upper ones only for typing (T12.4).
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "inference.spectrum layers"
type = "layers"
containers = ["noobfriend.inference.spectrum"]
layers = [
    "data | line | continuum",
    "workspace",
    "mcmc | mle",
    "noise | profiles",
    "priors",
    "_xp | _wavelength | _text",
]
