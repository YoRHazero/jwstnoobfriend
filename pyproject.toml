[project]
name = "noobfriend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "zchao", email = "zchao@icrr.u-tokyo.ac.jp" }
]
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[tool.ruff.lint]
extend-select = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["D104"]

[dependency-groups]
dev = [
    "ruff>=0.15.14",
]
